<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Eura</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-container" style="max-width: 440px;">
    <a href="index.html" class="back-link">&larr; Back to home</a>

    <h1 class="page-title" style="margin-top: 32px;">Reset Your Password</h1>

    <div id="reset-form-container">
      <p class="page-intro">Enter your new password below.</p>
      <form id="reset-form" style="margin-top: 24px;">
        <input
          type="password"
          id="new-password"
          class="waitlist-input"
          placeholder="New password (min 8 characters)"
          required
          minlength="8"
          style="width: 100%; margin-bottom: 12px;"
        />
        <input
          type="password"
          id="confirm-password"
          class="waitlist-input"
          placeholder="Confirm new password"
          required
          minlength="8"
          style="width: 100%; margin-bottom: 16px;"
        />
        <button type="submit" class="waitlist-button" id="reset-btn" style="width: 100%;">Reset Password</button>
      </form>
      <p id="reset-status" class="waitlist-status" hidden></p>
    </div>

    <div id="no-token" hidden>
      <p class="page-intro">This reset link is invalid or has expired. Please request a new one from the app.</p>
    </div>

    <div id="reset-success" hidden>
      <p class="page-intro">Your password has been reset. You can now log in with your new password in the Eura app.</p>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.eura.style/auth/reset-password';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const formContainer = document.getElementById('reset-form-container');
    const noToken = document.getElementById('no-token');
    const successDiv = document.getElementById('reset-success');

    if (!token) {
      formContainer.hidden = true;
      noToken.hidden = false;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const statusEl = document.getElementById('reset-status');
      const btn = document.getElementById('reset-btn');

      if (password !== confirm) {
        statusEl.textContent = 'Passwords do not match.';
        statusEl.className = 'waitlist-status error';
        statusEl.hidden = false;
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting...';
      statusEl.hidden = true;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, newPassword: password }),
        });

        if (res.ok) {
          formContainer.hidden = true;
          successDiv.hidden = false;
        } else {
          const data = await res.json();
          statusEl.textContent = data.error || data.detail || 'This link is invalid or has expired.';
          statusEl.className = 'waitlist-status error';
          statusEl.hidden = false;
        }
      } catch (err) {
        statusEl.textContent = 'Could not connect. Please try again later.';
        statusEl.className = 'waitlist-status error';
        statusEl.hidden = false;
      }

      btn.disabled = false;
      btn.textContent = 'Reset Password';
    });
  </script>
</body>
</html>
