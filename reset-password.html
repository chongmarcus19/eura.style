<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Eura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: #E8E4DA;
      color: #1A1A1A;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    .page-container {
      max-width: 440px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }
    .back-link {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: #888;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .back-link:hover { color: #1A1A1A; }
    .page-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 900;
      color: #1A1A1A;
      letter-spacing: -0.02em;
      margin-top: 28px;
      margin-bottom: 8px;
    }
    .page-brand {
      font-family: 'VT323', monospace;
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }
    .page-intro {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: #555;
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .reset-input {
      display: block;
      width: 100%;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      padding: 14px 16px;
      border: 1px solid #D0CCC4;
      background: transparent;
      color: #1A1A1A;
      outline: none;
      margin-bottom: 10px;
      border-radius: 3px;
      transition: border-color 0.2s;
    }
    .reset-input::placeholder { color: #bbb; }
    .reset-input:focus { border-color: #888; }
    .reset-btn {
      display: block;
      width: 100%;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 14px;
      background: #1A1A1A;
      color: #E8E4DA;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .reset-btn:hover { background: #333; }
    .reset-btn:disabled { background: #bbb; cursor: not-allowed; }
    .reset-status {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      margin-top: 10px;
      min-height: 1.2em;
    }
    .reset-status.success { color: #2D7D46; }
    .reset-status.error { color: #C04040; }
    @media (max-width: 480px) {
      .page-container { padding: 40px 16px 60px; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <a href="index.html" class="back-link">&larr; Back to home</a>

    <h1 class="page-title">Reset Your Password</h1>
    <p class="page-brand">EURA — STYLE NETWORK — 2026</p>

    <div id="reset-form-container">
      <p class="page-intro">Enter your new password below.</p>
      <form id="reset-form">
        <input type="password" id="new-password" class="reset-input" placeholder="New password (min 8 characters)" required minlength="8" />
        <input type="password" id="confirm-password" class="reset-input" placeholder="Confirm new password" required minlength="8" />
        <button type="submit" class="reset-btn" id="reset-btn">Reset Password</button>
      </form>
      <p id="reset-status" class="reset-status"></p>
    </div>

    <div id="no-token" hidden>
      <p class="page-intro">This reset link is invalid or has expired. Please request a new one from the app.</p>
    </div>

    <div id="reset-success" hidden>
      <p class="page-intro">Your password has been reset. You can now log in with your new password in the Eura app.</p>
    </div>
  </div>

  <script>
    var API_URL = 'https://api.eura.style/auth/reset-password';
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');

    var formContainer = document.getElementById('reset-form-container');
    var noToken = document.getElementById('no-token');
    var successDiv = document.getElementById('reset-success');

    if (!token) {
      formContainer.hidden = true;
      noToken.hidden = false;
    }

    document.getElementById('reset-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var password = document.getElementById('new-password').value;
      var confirm = document.getElementById('confirm-password').value;
      var statusEl = document.getElementById('reset-status');
      var btn = document.getElementById('reset-btn');

      if (password !== confirm) {
        statusEl.textContent = 'Passwords do not match.';
        statusEl.className = 'reset-status error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting...';
      statusEl.textContent = '';
      statusEl.className = 'reset-status';

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, newPassword: password })
      })
      .then(function(res) {
        if (res.ok) {
          formContainer.hidden = true;
          successDiv.hidden = false;
        } else {
          return res.json().then(function(data) {
            statusEl.textContent = data.error || data.detail || 'This link is invalid or has expired.';
            statusEl.className = 'reset-status error';
          });
        }
      })
      .catch(function() {
        statusEl.textContent = 'Could not connect. Please try again later.';
        statusEl.className = 'reset-status error';
      })
      .finally(function() {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      });
    });
  </script>
</body>
</html>
