<style>
:root{--paper:#F3EFE6;--ink:#171612;--green:#1E563C;--line:rgba(23,22,18,.24);--mono:'IBM Plex Mono',monospace}
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,rgba(23,22,18,.42) 1.7px,transparent 2px);background-size:112px 112px;background-position:54px 54px}
::selection{background:#D09A24;color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;width:min(560px,calc(100% - 36px));margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 0 0}
.wordmark{font-family:Outfit,sans-serif;font-weight:900;font-size:22px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.wordmark:focus-visible{outline:3px solid #D09A24;outline-offset:4px}
main{flex:1;width:min(560px,calc(100% - 36px));margin:0 auto;padding:36px 0 56px}
footer{display:flex;justify-content:space-between;gap:16px;width:min(560px,calc(100% - 36px));margin:0 auto;border-top:1px solid var(--line);padding:18px 0 calc(22px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(23,22,18,.65)}
footer nav{display:flex;gap:20px}footer a{color:inherit;text-decoration:none}footer a:hover{color:var(--green)}
.noscript{font-size:16px;line-height:1.6}
@media(min-width:700px){main{padding-top:64px}}
